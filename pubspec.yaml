name: cazino
description: A privacy-aware, backend-ready two-player card game prototype.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  test: ^1.28.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/cazino_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/cazino_logo.png
  remove_alpha_ios: true
  background_color_ios: "#073D2D"
  web:
    generate: true
    image_path: assets/branding/cazino_logo.png
    background_color: "#073D2D"
    theme_color: "#D4A72C"
  windows:
    generate: true
    image_path: assets/branding/cazino_logo.png
    icon_size: 256
